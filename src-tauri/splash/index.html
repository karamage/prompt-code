<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Prompt Code</title>
    <style>
      :root { color-scheme: dark; --bg: #050505; --text: #ededed; --muted: #6b6b6b; --var: #ffb38a; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --bg: #ececec; --text: #111111; --muted: #8a8a8a; --var: #b5531a; }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: min(560px, calc(100% - 48px)); text-align: center; }
      .glyph { display: flex; justify-content: center; align-items: center; gap: 6px; font: 300 64px/1 "Hiragino Mincho ProN", Georgia, serif; color: var(--muted); }
      .caret { width: 3px; height: 44px; border-radius: 2px; background: var(--var); animation: blink 1.1s steps(2, jump-none) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      p { margin: 18px 0 0; color: var(--muted); }
      pre {
        margin: 18px 0 0; padding: 12px 14px; max-height: 50vh; overflow: auto; text-align: left;
        white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: #ff8f8f; background: rgb(255 143 143 / 0.08); border-radius: 8px;
        -webkit-user-select: text; user-select: text;
      }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main data-tauri-drag-region>
      <div class="glyph" aria-hidden="true"><span>{{</span><span class="caret" id="caret"></span><span>}}</span></div>
      <p id="status">Opening your vault…</p>
      <pre id="error" hidden></pre>
    </main>
    <script>
      window.showError = (message) => {
        document.getElementById("caret").style.animation = "none";
        document.getElementById("status").textContent = "Prompt Code could not start. / Prompt Code を起動できませんでした。";
        const error = document.getElementById("error");
        error.textContent = message;
        error.hidden = false;
      };
    </script>
  </body>
</html>
