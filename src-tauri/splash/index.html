<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>Prompt Code</title>
    <style>
      :root { color-scheme: dark; --bg: #01050c; --text: #e6f3ff; --muted: #5f7898; --var: #2ee9ff; }
      @media (prefers-color-scheme: light) {
        :root { color-scheme: light; --bg: #e2eaf4; --text: #0a1830; --muted: #7d8fa8; --var: #0084a8; }
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: var(--bg);
        color: var(--text);
        font: 13px/1.6 -apple-system, BlinkMacSystemFont, "Hiragino Sans", system-ui, sans-serif;
        -webkit-user-select: none;
        user-select: none;
      }
      main { width: min(560px, calc(100% - 48px)); text-align: center; }
      .glyph { display: block; width: 90px; height: 48px; margin: 0 auto; overflow: visible; }
      .glyph path { fill: none; stroke: var(--muted); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; }
      .caret { fill: var(--var); animation: blink 1.1s steps(2, jump-none) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      p { margin: 18px 0 0; color: var(--muted); }
      pre {
        margin: 18px 0 0; padding: 12px 14px; max-height: 50vh; overflow: auto; text-align: left;
        white-space: pre-wrap; font: 12px/1.5 ui-monospace, Menlo, monospace;
        color: #ff4d6d; background: rgb(255 77 109 / 0.08); border-radius: 8px;
        -webkit-user-select: text; user-select: text;
      }
      [hidden] { display: none; }
    </style>
  </head>
  <body>
    <main data-tauri-drag-region>
      <svg class="glyph" viewBox="0 0 120 64" aria-hidden="true"><path d="M8 8 34 32 8 56" /><rect class="caret" id="caret" x="48" y="50" width="40" height="7" rx="2" /></svg>
      <p id="status">Opening your vault…</p>
      <pre id="error" hidden></pre>
    </main>
    <script>
      window.showError = (message) => {
        document.getElementById("caret").style.animation = "none";
        document.getElementById("status").textContent = "Prompt Code could not start. / Prompt Code を起動できませんでした。";
        const error = document.getElementById("error");
        error.textContent = message;
        error.hidden = false;
      };
    </script>
  </body>
</html>
